# MAE Training Configuration
# Configuration for Masked Auto-Encoder pretraining on spacepoints

# ============================================================
# TRAINING PARAMETERS
# ============================================================
RESUME_FROM_CHECKPOINT: false
CHECKPOINT_FILE: ""
RUN_NAME: "mae-spacepoint-v1"

# Training iterations
NUM_EPOCHS: 10000
NUM_ITERATIONS: 100000
START_ITER: 0
BATCH_SIZE: 1
DEVICE: "cuda"

# Logging
LOGGER: "wandb"  # "wandb", "tensorboard", or "none"
LOG_INTERVAL: 100
VALID_INTERVAL: 1000
CHECKPOINT_INTERVAL: 5000
SEED: 42

# ============================================================
# OPTIMIZER PARAMETERS
# ============================================================
OPTIMIZER: "adamw"
LEARNING_RATE: 1.0e-4
WEIGHT_DECAY: 0.05
BACKBONE_LR_SCALE: 0.1  # Backbone learns slower than transformer
CLIP_GRAD_NORM: 1.0

# Learning rate scheduler
SCHEDULER: "cosine_warmup"
WARMUP_EPOCHS: 5
MIN_LR: 1.0e-6

# ============================================================
# MODEL ARCHITECTURE
# ============================================================
# Backbone (image encoder)
BACKBONE_CHECKPOINT: "./unittests/larmatch_ubprod_ckpt78k_slimmed.pt"  # Path to pretrained LArMatch checkpoint
FREEZE_BACKBONE: false
STEM_NFEATURES: 16
NORM_LAYER: "instancenorm"  # "batchnorm" or "instancenorm"

# Transformer encoder
D_MODEL: 240
ENCODER_LAYERS: 6
ENCODER_HEADS: 8
ATTENTION_TYPE: "standard"  # "standard" or "linear"
DROPOUT: 0.1

# MAE decoder
DECODER_LAYERS: 2
DECODER_HEADS: 4
DECODER_DIM: 132
OUTPUT_DIM: 3  # 3 planes

# Position encoding
POS_ENCODING_TYPE: "sinusoidal"  # "sinusoidal" or "learnable_fourier"
MAX_SPATIAL_EXTENT: 1000.0  # Max coordinate value in cm

# Auxiliary heads
USE_AUXILIARY_HEADS: true
NUM_SSNET_CLASSES: 5
NUM_KEYPOINT_TYPES: 6

# EMA teacher for co-distillation
USE_EMA_TEACHER: false
EMA_DECAY: 0.999
CONTRASTIVE_DIM: 128

# ============================================================
# MAE MASKING
# ============================================================
MASK_RATIO: 0.50
MASKING_STRATEGY: "spatial"  # "random", "spatial", "particle", "ghost_aware"

# Spatial masking options
SPATIAL_BLOCK_SIZE: 50.0

# Particle-aware masking options
MASK_ENTIRE_PARTICLES: false
MIN_PARTICLE_FRACTION: 0.3

# Ghost-aware masking options
MASK_ONLY_TRUE: false
GHOST_MASK_RATIO: 0.5

# Curriculum masking options
INITIAL_MASK_RATIO: 0.5
FINAL_MASK_RATIO: 0.85
MASK_WARMUP_STEPS: 10000

# ============================================================
# DATA SAMPLING
# ============================================================
MAX_SPACEPOINTS: 10000  # Maximum spacepoints per event
SAMPLER_CHAIN:
  # Stage 1: Spatial box filter
  - name: "spatial_filter"  # optional, for retrieval
    type: spatial_box
    max_points: 100000
    random_box_mode: true
    box_size: [256.0, 234.0, 256.0]
    min_points: 2000
    detector_origin: [-45.0,-117.0,0.0]
    detector_extent: [550.0,234,1050]
    box_fallback_to_random: false
  # Stage 2: Importance sampling
  - name: "importance_filter"
    type: importance
    max_points: 1000
    true_weight: 5.0
    min_true_fraction: 0.3

# # Stratified sampler options
# TARGET_GHOST_RATIO: 2.0

# # Particle sampler options
# POINTS_PER_PARTICLE: 100
# MAX_PARTICLES: 200

# # Spatial grid sampler options
# GRID_SIZE: [10, 10, 10]

# # Spatial box options
# BOX_MIN: [0.0, -117.0, 0.0]
# BOX_MAX: [256.0, 117.0, 1036.0]
# DETECTOR_ORIGIN: [-45.0,-117.0,0.0]
# DETECTOR_EXTENT: [550.0,234,1050]
# BOX_FALLBACK_TO_RANDOM: true
# BOX_PADDING: 0.0
# RANDOM_BOX_MODE: true
# BOX_SIZE: [256.0,234.0,256.0]
# MIN_POINTS_IN_BOX: 500
# MAX_RESAMPLE_ATTEMPTS: 100

# ============================================================
# LOSS WEIGHTS
# ============================================================
USE_LEARNABLE_WEIGHTS: false

RECONSTRUCTION_WEIGHT: 1.0
RECONSTRUCTION_TYPE: "mse"  # "mse", "l1", "smooth_l1"

CONTRASTIVE_WEIGHT: 0.1
CONTRASTIVE_TYPE: "supervised"  # "supervised", "particle_pooling", "ntxent"

GHOST_WEIGHT: 0.5
SSNET_WEIGHT: 0.5
KEYPOINT_WEIGHT: 0.3
DISTILLATION_WEIGHT: 0.1

# ============================================================
# DATASET PARAMETERS
# ============================================================
# Training data
TRAIN_DATASET_INPUT_TXTFILE: "testdata_train.txt"  # Path to training file list or cache
TRAIN_DATASET_LOAD_FROM_CACHE: false
NUM_TRAIN_WORKERS: 2

# Validation data
VALID_DATASET_INPUT_TXTFILE: "testdata_valid.txt"  # Path to validation file list or cache
VALID_DATASET_LOAD_FROM_CACHE: false
NUM_VALID_WORKERS: 2
NUM_VALID_BATCHES: 1

# ============================================================
# ADVANCED OPTIONS
# ============================================================
# Mixed precision training
USE_AMP: false
AMP_DTYPE: "float16"  # "float16" or "bfloat16"

# Gradient accumulation
GRADIENT_ACCUMULATION_STEPS: 1

# Distributed training
USE_DISTRIBUTED: false
WORLD_SIZE: 1
LOCAL_RANK: 0

# Profiling
RUN_PROFILER: false
PROFILE_STEPS: 10

# Debug options
VERBOSE: false
DEBUG_NAN: false
